name: YB LED Remote APK
on:
  push:
    branches: [ main ]
    paths:
      - 'ledremote/**'
      - '.github/workflows/ledremote.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon -p ledremote assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: yb-led-remote-debug-apk
          path: ledremote/app/build/outputs/apk/debug/app-debug.apk
